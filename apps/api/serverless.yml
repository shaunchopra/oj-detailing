# OJ Auto Detailing — API (AWS Lambda + API Gateway HTTP API)
#
# Prerequisites:
#   1. AWS credentials configured (aws configure / IAM role)
#   2. Export secrets before deploy:
#        export RESEND_API_KEY=re_...
#        export RESEND_FROM="OJ Auto Detailing <quotes@oj-auto-detailing.com.au>"
#        export ALERT_EMAIL=you@example.com
#        export CLOUDFRONT_ORIGIN=https://dxxxxxxxx.cloudfront.net
#   3. Build the bundle: pnpm --filter @oj-detailing/api build
#
# Deploy:
#   pnpm --filter @oj-detailing/api deploy
#
# Static site (apps/web):
#   Build with `pnpm --filter @oj-detailing/web build`, then sync `apps/web/dist/`
#   to an S3 bucket configured for static website hosting. Point CloudFront at the
#   bucket and add a behavior so `/api/*` forwards to this API Gateway endpoint.

service: oj-detailing-api

frameworkVersion: "4"

custom:
  stage: ${opt:stage, 'prod'}
  # Keep existing HTTP APIs (CloudFormation stacks were recreated against these IDs).
  httpApiByStage:
    prod:
      id: cuvsx6p8fd
    dev:
      id: finqizix8b

provider:
  name: aws
  runtime: nodejs24.x
  region: ap-southeast-2
  stage: ${self:custom.stage}
  memorySize: 256
  timeout: 10
  httpApi: ${self:custom.httpApiByStage.${self:custom.stage}}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource: !GetAtt QuotesTable.Arn

  environment:
    NODE_ENV: production
    STAGE: ${self:custom.stage}
    RESEND_API_KEY: ${env:RESEND_API_KEY}
    RESEND_FROM: ${env:RESEND_FROM}
    CLOUDFRONT_ORIGIN: ${env:CLOUDFRONT_ORIGIN, 'https://oj-auto-detailing.com.au'}
    POSTHOG_API_KEY: ${env:POSTHOG_API_KEY}
    POSTHOG_HOST: ${env:POSTHOG_HOST}
    QUOTES_TABLE: !Ref QuotesTable

functions:
  api:
    handler: dist/lambda.handler
    events:
      # Catch-all for Express routes under /api/*
      - httpApi:
          path: /api/{proxy+}
          method: ANY
      - httpApi:
          path: /api
          method: ANY

package:
  individually: true
  patterns:
    - "!**"
    - "dist/lambda.js"
    - "dist/lambda.js.map"

resources:
  Resources:
    QuotesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: oj-detailing-quotes-${self:custom.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: quoteId
            AttributeType: S
        KeySchema:
          - AttributeName: quoteId
            KeyType: HASH

    # CloudWatch → SNS is the native alert path (not app-sent email).
    # After first deploy, confirm the SNS subscription in your inbox.
    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: oj-detailing-api-alerts-${self:custom.stage}
        DisplayName: OJ Detailing API ${self:custom.stage}

    AlertEmailSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref AlertTopic
        Protocol: email
        Endpoint: ${env:ALERT_EMAIL}

    AlertTopicPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
          - !Ref AlertTopic
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowCloudWatchAlarms
              Effect: Allow
              Principal:
                Service: cloudwatch.amazonaws.com
              Action: sns:Publish
              Resource: !Ref AlertTopic
              Condition:
                ArnLike:
                  aws:SourceArn: !Sub arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*

    ApiLambdaErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: oj-detailing-api-lambda-errors-${self:custom.stage}
        AlarmDescription: API Lambda Errors (unhandled throws, e.g. DynamoDB write failures)
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: !Ref ApiLambdaFunction
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic

    HttpApi5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: oj-detailing-api-5xx-${self:custom.stage}
        AlarmDescription: HTTP API 5xx (includes handled 500s such as quote email send failure)
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - Name: ApiId
            Value: ${self:custom.httpApiByStage.${self:custom.stage}.id}
        Statistic: Sum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertTopic
